<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iFonewala | Connect With Us</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
overflow:hidden;
background:
radial-gradient(circle at top left,#1e3c72,#000814),
radial-gradient(circle at bottom right,#4b0082,#000);
position:relative;
}

/* Floating Stars */

body::before{
content:'';
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
opacity:0.25;
animation:moveStars 40s linear infinite;
}

@keyframes moveStars{
from{
transform:translateY(0);
}
to{
transform:translateY(-100px);
}
}

/* Card */

.card{
position:relative;
width:420px;
padding:45px 30px;
border-radius:35px;
background:rgba(10,10,25,0.85);
backdrop-filter:blur(15px);
box-shadow:
0 0 25px rgba(0,255,255,0.2),
0 0 60px rgba(0,0,0,0.8);
text-align:center;
z-index:2;
border:1px solid rgba(255,255,255,0.08);
}

.logo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
background:white;
padding:10px;
box-shadow:0 0 30px #25D366;
margin-bottom:20px;
}

h1{
font-size:52px;
margin-bottom:10px;
color:white;
text-shadow:0 0 20px rgba(255,255,255,0.5);
}

.subtitle{
font-size:18px;
line-height:1.7;
color:#d0d0d0;
margin-bottom:35px;
}

/* Social Buttons */

.socials{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

.icon{
width:90px;
height:90px;
border-radius:28px;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
color:white;
text-decoration:none;
position:relative;
transition:0.4s;
transform-style:preserve-3d;
}

.icon:hover{
transform:
translateY(-10px)
rotateX(10deg)
rotateY(-10deg)
scale(1.08);
}

/* Glow Effects */

.website{
background:#0071e3;
box-shadow:0 0 30px #0071e3;
}

.youtube{
background:#ff0000;
box-shadow:0 0 30px #ff0000;
}

.instagram{
background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
box-shadow:0 0 30px #fd1d1d;
}

.facebook{
background:#1877f2;
box-shadow:0 0 30px #1877f2;
}

.whatsapp{
background:#25D366;
box-shadow:0 0 30px #25D366;
}

/* Footer */

.footer{
margin-top:35px;
font-size:14px;
color:#bbb;
}

.online{
margin-top:30px;
display:inline-block;
padding:12px 24px;
border-radius:40px;
background:#000;
color:#7df9ff;
box-shadow:0 0 20px rgba(0,255,255,0.5);
font-size:16px;
}

</style>
</head>

<body>

<div class="card">

<img class="logo"
src="https://ifonewala.com/wp-content/uploads/2025/01/cropped-logo.png">

<h1>iFonewala</h1>

<div class="subtitle">
Apple iPhone Repair • Accessories • Wholesale<br>
📍 Gaffar Market, Delhi
</div>

<div class="socials">

<a class="icon website"
href="https://ifonewala.com">
<i class="fas fa-globe"></i>
</a>

<a class="icon youtube"
href="https://youtube.com/channel/UCYduNUXcPgk54XYgkjRMr_w">
<i class="fab fa-youtube"></i>
</a>

<a class="icon instagram"
href="https://instagram.com/ifonewala_gaffar_market">
<i class="fab fa-instagram"></i>
</a>

<a class="icon facebook"
href="https://facebook.com/ifonewala">
<i class="fab fa-facebook-f"></i>
</a>

<a class="icon whatsapp"
href="https://wa.me/919013555505">
<i class="fab fa-whatsapp"></i>
</a>

</div>

<div class="online">
⚡ iFonewala Official Links
</div>

<div class="footer">
© 2026 iFonewala | All Rights Reserved
</div>

</div>

</body>
</html>
